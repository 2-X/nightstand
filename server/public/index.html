<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- Viewport settings for responsiveness -->

    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json">
    <!-- maximum-scale=1 + user-scalable=no removed: on Android Chrome (esp. on
         tablets) those two together change touch-event delivery so single-
         finger drag gets eaten by the gesture handler instead of scrolling.
         iOS Safari ignored them so this never showed up there. We accept the
         minor regression that pinch-zoom is now possible on the page. -->
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Apple PWA Settings -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">

    <!-- Favicon for various devices (all PNG; the .svg slot was removed when we
         swapped to a raster icon). -->
    <link rel="icon" type="image/png" sizes="96x96" href="/free-sleep-icon_96.png">
    <link rel="icon" type="image/png" sizes="192x192" href="/free-sleep-icon_192.png">
    <link rel="icon" type="image/png" sizes="512x512" href="/free-sleep-icon_512.png">

    <!-- Apple Touch Icons -->
    <link rel="apple-touch-icon" sizes="120x120" href="/free-sleep-icon_120.png">
    <link rel="apple-touch-icon" sizes="152x152" href="/free-sleep-icon_144.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/free-sleep-icon_180.png">

    <!-- Windows Tile Icons -->
    <meta name="msapplication-TileImage" content="/free-sleep-icon_144.png">
    <meta name="msapplication-TileColor" content="#000000">

    <!-- Theme color for mobile address bar -->
    <meta name="theme-color" content="#000000">

    <title>Nightstand</title>

    <script type="module" crossorigin src="/index.js"></script>
    <script>(function () {
var key = "nightstand-theme", backgrounds = {"lamp":"#000000","classic":"#010101","glass":"#000000"};
var theme = "lamp";
try {
  var stored = window.localStorage.getItem(key);
  if (stored && Object.prototype.hasOwnProperty.call(backgrounds, stored)) theme = stored;
} catch (error) {}
var root = document.documentElement;
root.setAttribute('data-theme', theme);
root.style.backgroundColor = backgrounds[theme];
root.style.colorScheme = 'dark';
document.querySelectorAll('meta[name="theme-color"], meta[name="msapplication-TileColor"]').forEach(function (meta) {
  meta.setAttribute('content', backgrounds[theme]);
});
})();</script>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
