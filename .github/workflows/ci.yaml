name: CI

on:
  pull_request:
  push:
    branches: [main, dev]

jobs:
  build:
    name: Build
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
          cache-dependency-path: |
            ./app/package-lock.json
            ./server/package-lock.json

      - name: Install dependencies (app)
        working-directory: app
        run: npm ci

      - name: Install dependencies (server)
        working-directory: server
        run: npm ci

      - name: Generate Prisma client
        working-directory: server
        run: npm run generate

      - name: Build (server)
        working-directory: server
        run: npm run build:pr

      - name: Build (app)
        working-directory: app
        run: npm run build:pr

      # Pods install the committed bundles from main, so they must match the
      # source there. On dev they are refreshed once per batch instead.
      - name: Check committed bundles
        env:
          STRICT: ${{ github.ref == 'refs/heads/main' || github.base_ref == 'main' }}
        run: |
          # check-bundles exits 1 when it lists orphans; the list decides below.
          problems=$(git status --porcelain; bash scripts/check-bundles.sh || true)
          if [ -n "$problems" ]; then
            echo "$problems"
            if [ "$STRICT" = true ]; then
              echo "Committed bundles do not match the source. Rebuild with npm ci && npm run build:pr in server/ and app/, remove the files listed as orphan, and commit."
              exit 1
            fi
            echo "::notice::Committed bundles are out of date; rebuild them before deploying or releasing."
          fi

  shellcheck:
    name: Shellcheck
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      # Preinstalled on GitHub's Ubuntu images. Errors only: the scripts run
      # as root on the Pod, so a real error fails the build.
      - name: Shellcheck
        run: shellcheck -S error scripts/*.sh scripts/migrate/*.sh ops/*.sh

  lint:
    name: Lint
    runs-on: ubuntu-24.04

    strategy:
      matrix:
        package-name:
          - app
          - server

    defaults:
      run:
        working-directory: ${{ matrix.package-name }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
          cache-dependency-path: ./${{ matrix.package-name }}/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

  test:
    name: Test
    runs-on: ubuntu-24.04

    strategy:
      matrix:
        package-name:
          - app
          - server

    defaults:
      run:
        working-directory: ${{ matrix.package-name }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
          cache-dependency-path: ./${{ matrix.package-name }}/package-lock.json

      - name: Install dependencies
        run: npm ci

      # The app test harness renders components that import zod schemas from
      # server/src, so the app job needs the server package's dependencies too.
      - name: Install dependencies (server, for app tests)
        if: matrix.package-name == 'app'
        working-directory: server
        run: npm ci

      - name: Generate Prisma client
        if: matrix.package-name == 'server'
        run: npm run generate

      - name: Test
        run: npm test

  test-python:
    name: Test (biometrics, Python ${{ matrix.python }})
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        # 3.9 on Pod 3 units set up with an SD card, 3.10 on the rest.
        python: ['3.9', '3.10']

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}

      - name: Install dependencies
        run: |
          pip install -r scripts/python/requirements.txt
          pip install pytest

      - name: Install nats-server
        env:
          NATS_VERSION: v2.14.7
          NATS_SHA256: e5c20b1cb2c0566b54c544312e91e011f9e130c5c80f16a14f4cf28ef30b8be2
        run: |
          archive="nats-server-${NATS_VERSION}-linux-amd64.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$archive" \
            "https://github.com/nats-io/nats-server/releases/download/${NATS_VERSION}/${archive}"
          echo "${NATS_SHA256}  $RUNNER_TEMP/$archive" | sha256sum --check -
          mkdir -p "$RUNNER_TEMP/nats-bin"
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP/nats-bin" --strip-components=1 \
            "nats-server-${NATS_VERSION}-linux-amd64/nats-server"
          echo "$RUNNER_TEMP/nats-bin" >> "$GITHUB_PATH"

      - name: Test
        # bash here adds pipefail, so a failing pytest is not hidden by tee.
        shell: bash
        run: |
          nats-server --version
          python -m pytest biometrics/__tests__/ -v -rs | tee "$RUNNER_TEMP/pytest.log"

      - name: Require NATS integration tests to run
        run: |
          if grep -E '^SKIPPED .*nats' "$RUNNER_TEMP/pytest.log"; then
            echo 'NATS integration tests were skipped' >&2
            exit 1
          fi

  e2e:
    name: E2E
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # The screenshot baselines are rendered in this image, so CI renders in it too.
    # The tag moves with @playwright/test, and the baselines are rendered again with it.
    container:
      image: mcr.microsoft.com/playwright:v1.61.1-noble
      options: --ipc=host

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
          cache-dependency-path: |
            ./app/package-lock.json
            ./server/package-lock.json

      - name: Install dependencies (app)
        working-directory: app
        run: npm ci

      # The demo build's tsc step imports server zod schemas.
      - name: Install dependencies (server)
        working-directory: server
        run: npm ci

      - name: Build the demo
        working-directory: app
        run: npm run build:demo

      # The layout sweep and WebKit run in the job below, in parallel.
      - name: Run E2E
        working-directory: app
        run: npx playwright test --project=chromium

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-test-results
          path: app/test-results
          retention-days: 14

  e2e-layout:
    name: E2E (layout and WebKit)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # The screenshot baselines are rendered in this image, so CI renders in it too.
    # The tag moves with @playwright/test, and the baselines are rendered again with it.
    container:
      image: mcr.microsoft.com/playwright:v1.61.1-noble
      options: --ipc=host

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
          cache-dependency-path: |
            ./app/package-lock.json
            ./server/package-lock.json

      - name: Install dependencies (app)
        working-directory: app
        run: npm ci

      # The demo build's tsc step imports server zod schemas.
      - name: Install dependencies (server)
        working-directory: server
        run: npm ci

      - name: Build the demo
        working-directory: app
        run: npm run build:demo

      # The image ships WebKit as well as Chromium, so nothing extra to install.
      - name: Run the layout sweep and WebKit
        working-directory: app
        run: npx playwright test --project='sweep-*' --project=webkit

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-layout-test-results
          path: app/test-results
          retention-days: 14
